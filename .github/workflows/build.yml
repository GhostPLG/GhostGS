name: Build GhostGS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: msbuild Erbium.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            x64/Release/Erbium.dll x64/Release/ErbiumClient.dll \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --format='%s (%h)')" \
            --latest